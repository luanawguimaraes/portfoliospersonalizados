<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Área da cliente | Luana Guimarães</title>
<meta name="description" content="Área exclusiva para clientes de Luana Guimarães: etapas, checklist de materiais, tutoriais e guia de fotos.">
<meta name="theme-color" content="#FEF8E7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300..900;1,300..900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FEF8E7;--pink:#C72D67;--pink-soft:#C72D67;--pink-dark:#A3204F;--cream:#2B2B2B;--muted:#555050;--grad:linear-gradient(90deg,#C72D67,#EA70A5);
    --border:rgba(43,43,43,.1);--radius:22px;--radius-sm:14px;
    --font-title:"Mulish","Trebuchet MS",sans-serif;--font-body:"Open Sans",system-ui,sans-serif;--nav-h:72px;
    --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px)}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--font-body);line-height:1.65;overflow-x:hidden}
  h1,h2,h3{font-family:var(--font-title);line-height:1.1;margin:0}
  p{margin:0}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--pink-soft);outline-offset:3px;border-radius:8px}
  em{font-family:var(--font-body);font-weight:300;font-style:italic;color:var(--pink)}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-title);font-weight:700;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pink-soft);margin-bottom:14px}
  .eyebrow::before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px}

  /* menu */
  .nav{position:fixed;inset:0 0 auto 0;z-index:100;height:var(--nav-h);display:flex;align-items:center;background:rgba(254,248,231,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
  .nav .wrap{width:min(1180px,100%);margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{font-family:var(--font-title);font-weight:900;font-size:1.1rem;text-decoration:none;line-height:1.1}
  .logo span{color:var(--pink)}
  .logo small{display:block;font-family:var(--font-body);font-weight:400;font-size:.7rem;color:var(--muted)}
  .nav-tabs{display:flex;gap:6px}
  .nav-tabs a{text-decoration:none;font-size:.85rem;font-weight:500;padding:9px 14px;border-radius:999px;color:var(--muted);border:1px solid var(--border);white-space:nowrap}
  .nav-tabs a[aria-current="page"]{background:var(--pink);border-color:var(--pink);color:#fff}

  /* tela da palavra-chave */
  .gate{position:relative;min-height:100vh;display:grid;place-items:center;padding:calc(var(--nav-h) + 30px) 18px 50px;overflow:hidden;
    background:radial-gradient(55% 45% at 50% 40%,rgba(199,45,103,.32),transparent 70%),linear-gradient(180deg,#0a0508,#120a0f 70%,var(--bg))}
  .gate::before{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:240px;opacity:.18;mix-blend-mode:overlay;pointer-events:none}
  .gate-card{position:relative;width:min(470px,100%);text-align:center;padding:44px 30px 36px;border-radius:26px;background:rgba(255,255,255,.8);border:1px solid rgba(199,45,103,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(199,45,103,.22)}
  .lock{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--pink);box-shadow:0 10px 30px rgba(199,45,103,.5)}
  .lock svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2}
  .gate h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:900;letter-spacing:-.02em;margin-bottom:12px}
  .gate p{color:var(--muted);margin-bottom:26px}
  .gate form{display:grid;gap:12px}
  .gate label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .gate input{width:100%;font:inherit;font-size:1rem;text-align:center;color:var(--cream);background:rgba(254,248,231,.65);border:1px solid var(--border);border-radius:999px;padding:15px 18px}
  .gate input:focus{outline:none;border-color:var(--pink-soft);box-shadow:0 0 0 3px rgba(199,45,103,.25)}
  .gate input[aria-invalid="true"]{border-color:#ff6b6b;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 28px;border-radius:999px;border:0;font-family:var(--font-title);font-weight:800;font-size:.92rem;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 10px 30px rgba(199,45,103,.4);transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .gate .msg{min-height:1.4em;font-size:.88rem;color:#ff8f8f;margin:4px 0 0}
  .gate .not-client{margin-top:22px;font-size:.85rem;color:var(--muted)}
  .gate .not-client a{color:var(--pink-soft)}

  /* conteúdo liberado */
  #area[hidden],.gate[hidden]{display:none}
  .c-hero{padding:calc(var(--nav-h) + 60px) 20px 70px;text-align:center;position:relative;overflow:hidden;
    background:radial-gradient(55% 60% at 50% 30%,rgba(199,45,103,.3),transparent 70%),linear-gradient(180deg,#0a0508,var(--bg))}
  .c-hero::before{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:240px;opacity:.16;mix-blend-mode:overlay;pointer-events:none}
  .c-hero > *{position:relative;max-width:720px;margin-left:auto;margin-right:auto}
  .c-hero h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:900;letter-spacing:-.03em;margin-bottom:16px}
  .c-hero p{color:var(--muted);margin-bottom:28px}
  .c-index{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .c-index a{text-decoration:none;font-size:.85rem;padding:8px 15px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.75)}
  .c-index a:hover{border-color:var(--pink)}
  .c-block{padding:80px 20px}
  .c-block > *{max-width:980px;margin-left:auto;margin-right:auto}
  .c-block > .eyebrow{display:flex;width:fit-content;margin-left:max(0px,calc((100% - 980px)/2))}
  .c-block h2{font-size:clamp(1.8rem,5vw,2.7rem);font-weight:900;letter-spacing:-.02em;margin-bottom:18px}
  .c-lead{color:var(--muted);margin-bottom:30px;max-width:680px}
  .c-note{margin-top:24px;padding:16px 20px;border-radius:var(--radius-sm);border-left:4px solid var(--pink);background:rgba(199,45,103,.08);font-size:.95rem}
  .light{background:var(--cream);color:#1a1a1a}
  .light h2,.light h3,.light b,.light strong{color:#121212}
  .light em{color:var(--pink-dark)}
  .light .eyebrow{color:var(--pink-dark)}
  .light .c-lead,.light p{color:#4a4540}

  .c-steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;counter-reset:s;margin-top:30px}
  .c-steps li{counter-increment:s;padding:24px 18px;border-radius:var(--radius);background:rgba(255,255,255,.75);border:1px solid var(--border)}
  .c-steps li::before{content:"0" counter(s);display:block;font-family:var(--font-title);font-weight:900;font-size:2.2rem;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--pink);margin-bottom:12px}
  .c-steps b{display:block;font-family:var(--font-title);margin-bottom:6px}
  .c-steps span{color:var(--muted);font-size:.88rem}

  .c-check{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .c-check label{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--radius-sm);background:#fff;border:1px solid rgba(0,0,0,.08);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.05)}
  .c-check input{flex:none;width:22px;height:22px;margin-top:2px;accent-color:var(--pink)}
  .c-check span{color:#4a4540;font-size:.93rem}
  .c-check b{display:block}
  .c-check input:checked + span{opacity:.55;text-decoration:line-through}

  .c-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .c-card{padding:26px 24px;border-radius:var(--radius);background:rgba(255,255,255,.75);border:1px solid var(--border)}
  .c-card h3{font-size:1.1rem;margin-bottom:8px;color:var(--pink-soft)}
  .c-card p{color:var(--muted);font-size:.93rem}
  .c-card b{color:var(--cream)}

  .c-tips{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .c-tip{padding:22px 18px;border-radius:var(--radius);background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 8px 24px rgba(0,0,0,.05)}
  .c-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:rgba(199,45,103,.12);font-size:1.3rem;margin-bottom:12px}
  .c-tip h3{font-size:1rem;margin-bottom:6px}
  .c-tip p{font-size:.88rem}

  .c-btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 28px;border-radius:999px;background:var(--pink);color:#fff;font-family:var(--font-title);font-weight:800;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;box-shadow:0 10px 30px rgba(199,45,103,.35)}
  .c-list{padding-left:20px;display:grid;gap:10px;color:#4a4540}
  .c-videos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .c-video{aspect-ratio:9/16;border-radius:var(--radius);background:linear-gradient(160deg,#3a1029,#160b12);border:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:6px}
  .c-video span{align-self:flex-start;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--pink);color:#fff}
  .c-video b{font-family:var(--font-title);font-size:.95rem}
  .c-video video{width:100%;height:100%;object-fit:cover;border-radius:var(--radius)}
  .c-help{text-align:center}
  .c-help .c-lead{margin-left:auto;margin-right:auto}
  .logout{display:block;margin:0 auto;padding:30px 20px 60px;text-align:center}
  .logout button{background:none;border:1px solid var(--border);color:var(--muted);font:inherit;font-size:.85rem;padding:10px 18px;border-radius:999px;cursor:pointer}

  @media (max-width:900px){
    .c-steps{grid-template-columns:1fr 1fr}
    .c-tips{grid-template-columns:1fr 1fr}
    .c-videos{grid-template-columns:1fr 1fr 1fr;gap:10px}
  }
  @media (max-width:640px){
    .nav .wrap{padding:0 14px}
    .logo small{display:none}
    .nav-tabs a{padding:8px 11px;font-size:.78rem}
    .c-check,.c-cards,.c-steps{grid-template-columns:1fr}
    .c-tips{grid-template-columns:1fr 1fr;gap:10px}
    .c-tip{padding:18px 14px}
    .c-block{padding:64px 16px}
    .c-videos{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:62%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
    .c-video{scroll-snap-align:start}
  }
  /* Estilo C: creme quadriculado, tinta e rosa em degradê */
  body{background-image:linear-gradient(rgba(43,43,43,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(43,43,43,.045) 1px,transparent 1px);background-size:28px 28px}
  em{font-family:var(--font-title);font-style:normal;font-weight:900;color:var(--pink)}
  .gate h1,.c-hero h1,.c-block h2{font-weight:900}
  .gate{background:linear-gradient(180deg,rgba(252,233,240,.85),rgba(254,248,231,0))}
  .gate::before,.c-hero::before{mix-blend-mode:multiply;opacity:.06}
  .gate-card{background:rgba(255,255,255,.85);box-shadow:0 26px 60px rgba(199,45,103,.15)}
  .lock,.btn,.c-btn,.nav-tabs a[aria-current="page"]{background:var(--grad);color:#fff}
  .gate input{background:#fff;color:var(--cream)}
  .gate .msg{color:#C0392B}
  .c-hero{background:linear-gradient(180deg,rgba(252,233,240,.85),rgba(254,248,231,0))}
  .c-index a{background:#fff}
  .light{background:#fff}
  .c-check label,.c-tip{background:var(--bg)}
  .c-card h3{color:var(--pink)}
  .c-card b{color:var(--cream)}
  .c-steps li,.c-card{background:#fff}
  .c-video{background:linear-gradient(160deg,#FBE6EE,#FDF3EC);color:var(--cream)}
  .logo{font-weight:400}
  .logo b{font-weight:400;color:var(--pink)}
  .eyebrow{color:var(--pink)}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="index.html" class="logo">Luana <b>Guimarães</b><small>Portfólios para creators</small></a>
    <nav class="nav-tabs" aria-label="Abas do site">
      <a href="index.html">Início</a>
      <a href="cliente.html" aria-current="page">Área da cliente</a>
    </nav>
  </div>
</header>

<main>
  <!-- TELA DA PALAVRA-CHAVE -->
  <section class="gate" id="gate" aria-labelledby="gate-title">
    <div class="gate-card">
      <div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <h1 id="gate-title">Você já é minha <em>cliente?</em></h1>
      <p>Então digite a palavra-chave para ter acesso a mais informações sobre o seu portfólio.</p>
      <form id="gateForm" autocomplete="off">
        <label for="senha">Palavra-chave</label>
        <input id="senha" type="password" placeholder="Digite a palavra-chave" required autocapitalize="off" spellcheck="false">
        <button class="btn" type="submit">Acessar minha área</button>
        <p class="msg" id="gateMsg" role="alert"></p>
      </form>
      <p class="not-client">Ainda não é cliente? <a href="index.html#investimento">Conheça os pacotes</a></p>
    </div>
  </section>

  <!-- CONTEÚDO LIBERADO (aparece depois da palavra-chave) -->
  <div id="area" hidden></div>
</main>

const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function abrir(senha){
  const p = JSON.parse(atob(CONTEUDO_TRANCADO));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(p.s), iterations:p.n, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(p.i) }, chave, b64(p.c));
  return new TextDecoder().decode(claro);
}

function mostrar(html){
  const area = $("#area");
  area.innerHTML = html + '<div class="logout"><button type="button" id="sair">Sair da área da cliente</button></div>';
  $("#gate").hidden = true; area.hidden = false;
  document.title = "Minha área | Luana Guimarães";
  window.scrollTo(0, 0);
  // checklist: salva as marcações neste aparelho
  area.querySelectorAll("#cCheck input").forEach(cb => {
    try { cb.checked = localStorage.getItem("check-" + cb.dataset.k) === "1"; } catch (e) {}
    cb.addEventListener("change", () => { try { localStorage.setItem("check-" + cb.dataset.k, cb.checked ? "1" : "0"); } catch (e) {} });
  });
  $("#sair").addEventListener("click", () => { try { sessionStorage.removeItem("chaveCliente"); } catch (e) {} location.reload(); });
}

$("#gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const inp = $("#senha"), msg = $("#gateMsg");
  msg.textContent = ""; inp.removeAttribute("aria-invalid");
  try {
    const html = await abrir(inp.value);
    try { sessionStorage.setItem("chaveCliente", inp.value); } catch (e) {}
    mostrar(html);
  } catch (err) {
    inp.setAttribute("aria-invalid", "true"); void inp.offsetWidth;
    msg.textContent = "Palavra-chave incorreta. Confira e tente de novo.";
    inp.select();
  }
});

// se já entrou nesta visita, abre direto
(async () => {
  let s = null; try { s = sessionStorage.getItem("chaveCliente"); } catch (e) {}
  if (s) { try { mostrar(await abrir(s)); } catch (e) {} }
})();
</script>
